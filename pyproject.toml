[project]
name = "quran-model-api-app"
version = "0.2.0"
description = "Quran recitation APIs (Whisper + Muaalem tajweed) with a Streamlit test client"
requires-python = ">=3.11,<3.13"
dependencies = [
    "transformers>=4.46,<5",
    "quran-muaalem>=0.2.2",
    "rapidfuzz>=3.14.5",
    "av>=14",  # decodes wav/mp3/ogg/webm/m4a without ffmpeg
    "hf-xet>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "streamlit>=1.66",  # test client: custom components v2, st.tabs(on_change=)
    "requests>=2.31",
]

# PyTorch build:
#   uv sync                                   → CUDA 12.8 (default; RTX 50-series / Blackwell needs it)
#   uv sync --no-default-groups --group cpu   → CPU-only (servers without a GPU; Dockerfile default)
[dependency-groups]
cpu = ["torch>=2.7"]
cu128 = ["torch>=2.7"]

[tool.uv]
package = false
default-groups = ["cu128"]
conflicts = [[{ group = "cpu" }, { group = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu128", group = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
