[project]
name = "quran-transcriber"
version = "0.2.0"
description = "Quran recitation APIs (Whisper + Muaalem tajweed) with a Streamlit test client"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.7",
    "transformers>=4.46,<5",
    "quran-muaalem>=0.2.2",
    "rapidfuzz>=3.14.5",
    "av>=14",  # decodes wav/mp3/ogg/webm/m4a without ffmpeg
    "hf-xet>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "streamlit>=1.66",  # test client: custom components v2, st.tabs(on_change=)
    "requests>=2.31",
]

# RTX 50-series (Blackwell) needs the CUDA 12.8 build of PyTorch.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = false
