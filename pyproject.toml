[project]
name = "quran-transcriber"
version = "0.1.0"
description = "Local Quran recitation transcription with Whisper + Streamlit"
requires-python = ">=3.11,<3.13"
dependencies = [
    "streamlit>=1.66",  # custom components v2, st.tabs(on_change=)
    "transformers>=4.46,<5",
    "soundfile>=0.12",
    "scipy>=1.11",
    "accelerate>=1.0",
    "hf-xet>=1.0",
    "python-dotenv>=1.0",
    "azure-cognitiveservices-speech>=1.40",
    "quran-muaalem>=0.2.2",
    "rapidfuzz>=3.14.5",
]

# PyTorch build:
#   uv sync                                   → CUDA 12.8 (default; RTX 50-series / Blackwell needs it)
#   uv sync --no-default-groups --group cpu   → CPU-only (servers without a GPU, used by the Dockerfile)
[dependency-groups]
cpu = ["torch>=2.7"]
cu128 = ["torch>=2.7"]

[tool.uv]
package = false
default-groups = ["cu128"]
conflicts = [[{ group = "cpu" }, { group = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu128", group = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
