services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Base, not Tiny: Tiny is faster on CPU but drops whole ayat (e.g. 112:2).
      PRELOAD_MODELS: ${PRELOAD_MODELS:-Whisper Base (Quran),Muaalem (tajweed)}
      ALLOW_MODEL_CONTROL: ${ALLOW_MODEL_CONTROL:-false}
    volumes:
      - models:/models  # Hugging Face cache, so models download only once
    expose:
      - "8501"

  # HTTPS in front of the app: browsers only allow the microphone on https:// (or localhost).
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env (a domain pointing at this server)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  models:
  caddy_data:
  caddy_config:
